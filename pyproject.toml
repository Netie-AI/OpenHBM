[project]
name = "netie-open-hbm"
version = "0.0.1"
description = "Open-source HBM4 controller, PHY-shim, and RISC-V-native LPU accelerator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "The Netie Open HBM Authors" }
]
keywords = ["hbm4", "memory-controller", "open-silicon", "risc-v", "lpu", "ai-accelerator"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Electronic Design Automation",
  "Development Status :: 2 :: Pre-Alpha"
]
dependencies = [
  "cocotb==2.0.1",
  "cocotb-coverage>=1.2.0",
  "cocotb-test>=0.2.6",
  "pyuvm==4.0.1",
  "pyvsc>=0.9.5",
  "edalize>=0.6.1",
  "fusesoc>=2.4",
  "siliconcompiler==0.34.0",
  "hjson>=3.1",
  "mako>=1.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7"
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=4.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "asciidoctor>=2.0"
]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0"
]

[project.scripts]
nieda-vendor    = "util.vendor:main"
nieda-reggen    = "util.reggen.regtool:main"
nieda-eval      = "tools.agent_eval.harness.run:main"
nieda-flow      = "pd.sc_flows.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["util", "tools", "pd"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["hw/vendor", "third_party", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["hw/vendor", "third_party", "build"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tools/agent_eval/harness/tests", "util/tests"]

[tool.uv]
managed = true
