name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verible:
    name: verible-verilog-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install verible
        run: |
          VERIBLE_VERSION=v0.0-4071-g8d9f2c97
          curl -L "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz" \
            -o /tmp/verible.tar.gz
          tar -xzf /tmp/verible.tar.gz -C /tmp
          sudo cp /tmp/verible-${VERIBLE_VERSION}/bin/* /usr/local/bin/
          verible-verilog-lint --version

      - name: Run verible-verilog-lint
        run: |
          shopt -s globstar nullglob
          files=( hw/ip/**/*.sv hw/subsystems/**/*.sv hw/top/**/*.sv hw/formal/**/*.sv )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SystemVerilog files yet -- treating as success."
            exit 0
          fi
          verible-verilog-lint --rules_config .rules.verible_lint "${files[@]}"

  python-lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --no-incremental tools util pd || true  # advisory until typed

  hjson-validate:
    name: hjson + reggen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install hjson jsonschema
      - run: |
          shopt -s globstar nullglob
          files=( hw/ip/**/data/*.hjson )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Hjson files yet -- treating as success."
            exit 0
          fi
          for f in "${files[@]}"; do
            python -c "import hjson, sys; hjson.load(open(sys.argv[1]))" "$f"
            echo "OK: $f"
          done
