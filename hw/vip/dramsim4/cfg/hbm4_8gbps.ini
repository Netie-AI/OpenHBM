; HBM4 8 Gb/s configuration for DRAMsim3-compatible BFMs.
; Geometry numbers come from the JEDEC press release (Dec 2025).
; Timing numbers are bounds, NOT spec assertions. See
; docs/spec/hbm4_timing.adoc for provenance.

[dram_structure]
protocol               = HBM4
bankgroups             = 4
banks_per_group        = 4
rows                   = 131072
columns                = 64
device_width           = 64
BL                     = 8

[timing]
tCK                    = 0.250          ; ns -- 8 Gb/s
CL                     = 24
CWL                    = 20
tRCD                   = 14
tRP                    = 14
tRAS                   = 28
tRC                    = 42
tRFC                   = 200
tRFC2                  = 120
tRFC4                  = 80
tREFI                  = 1950
tFAW                   = 25
tRRDS                  = 4
tRRDL                  = 6
tCCDS                  = 8
tCCDL                  = 16
tWR                    = 16
tWTR_S                 = 4
tWTR_L                 = 6
tCKE                   = 5
tXP                    = 8
tRTRS                  = 1

[power]
VDD                    = 1.0
IDD0                   = 60
IDD2P                  = 32
IDD2N                  = 50
IDD3P                  = 40
IDD3N                  = 55
IDD4W                  = 250
IDD4R                  = 230
IDD5AB                 = 250

[system]
channel_size           = 2048           ; MB per channel
channels               = 32
bus_width              = 64
address_mapping        = chan_pseudo_bg_ba_row_col   ; matches addr_map MODE_CH_STRIPED default
queue_structure        = PER_BANK
row_buf_policy         = OPEN_PAGE
refresh_policy         = RANK_LEVEL_STAGGERED
write_buf_size         = 16
read_buf_size          = 16

[other]
epoch_period           = 666666
output_level           = 1
